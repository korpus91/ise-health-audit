[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ise-health-audit"
version = "0.1.0"
description = "Read-only Cisco ISE node health and certificate-expiry audit via the ISE OpenAPI"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
authors = [{ name = "Arkadiy Ayrapetov" }]
dependencies = ["requests>=2.31"]
keywords = ["cisco", "ise", "pki", "certificates", "802.1x", "audit"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
  "Intended Audience :: System Administrators",
  "Topic :: System :: Networking",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/korpus91/ise-health-audit"
Issues = "https://github.com/korpus91/ise-health-audit/issues"

[project.scripts]
ise-audit = "ise_audit:main"

[tool.setuptools]
py-modules = ["ise_audit"]